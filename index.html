<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player</title>
    <!-- HLS.js for cross-browser live stream playback support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 340px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: flex-direction;
            flex-direction: column;
            padding: 1rem;
            gap: 0.75rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        select, input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background-color: var(--bg-dark);
            border: 1px solid var(--panel-border);
            border-radius: 0.375rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .channel-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: -0.25rem;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            padding-right: 0.25rem;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.75rem;
            border-radius: 0.375rem;
            background-color: var(--bg-dark);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }

        .channel-item:hover {
            border-color: var(--accent);
            transform: translateX(2px);
        }

        .channel-item.active {
            background-color: var(--accent);
            color: var(--bg-dark);
            font-weight: 600;
        }

        .channel-logo {
            width: 32px;
            height: 32px;
            border-radius: 0.25rem;
            object-fit: contain;
            background-color: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .channel-title {
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Player Main Area Styling */
        .player-stage {
            flex: 1;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 120px);
            outline: none;
        }

        .player-info {
            width: 100%;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .now-playing {
            font-size: 1rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            background-color: var(--panel-border);
            color: var(--text-muted);
        }

        .status-badge.live {
            background-color: #22c55e;
            color: #000;
            font-weight: 700;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--panel-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 45vh;
            }
            .player-stage {
                height: 55vh;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>IPTV Player</h1>
    <div id="statusBadge" class="status-badge">Idle</div>
</header>

<div class="main-container">
    <!-- Sidebar / Channel List -->
    <div class="sidebar">
        <div class="controls">
            <select id="playlistSelect" onchange="loadSelectedPlaylist()">
                <option value="">-- Select Playlist --</option>            
                <option value="DrSujonPaul1.m3u">all_channels.m3u</option>
                <option value="DrSujonPaul1.m3u">BugsfreeBD1.m3u</option>               
                <option value="DrSujonPaul1.m3u">DrSujonPaul1.m3u</option>               
                <option value="time2shine1.m3u">time2shine1.m3u</option>
                <option value="imShakil1.m3u">imShakil1.m3u</option>
                <option value="lupael.m3u">lupael.m3u</option>        
                <option value="Margify Bdix1.m3u">Margify Bdix1.m3u</option>          
                <option value="Shadmanislam1.m3u">Shadmanislam1.m3u</option>             
                <option value="ShamimHossain1.m3u">ShamimHossain1.m3u</option>           
                <option value="TeachEasyLife1.m3u">TeachEasyLife1.m3u</option>
            
            </select>
            <input type="text" id="searchInput" placeholder="Search channel..." oninput="filterChannels()">
            <div class="channel-count" id="channelCount">Channels: 0</div>
        </div>

        <div class="channel-list" id="channelList">
            <!-- Dynamic channels loaded here -->
        </div>
    </div>

    <!-- Main Player Stage -->
    <div class="player-stage">
        <video id="videoPlayer" controls autoplay></video>
        <div class="player-info">
            <div class="now-playing" id="nowPlaying">Select a playlist and channel to start watching</div>
        </div>
    </div>
</div>

<script>
    let currentChannels = [];
    let hlsInstance = null;

    // Load first playlist automatically when page opens
    window.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('playlistSelect');
        if (select.options.length > 1) {
            select.selectedIndex = 1;
            loadSelectedPlaylist();
        }
    });

    async function loadSelectedPlaylist() {
        const playlistFile = document.getElementById('playlistSelect').value;
        const channelListContainer = document.getElementById('channelList');
        const countLabel = document.getElementById('channelCount');

        if (!playlistFile) return;

        channelListContainer.innerHTML = '<div style="padding:1rem; text-align:center; color:var(--text-muted);">Loading channels...</div>';

        try {
            const response = await fetch(encodeURIComponent(playlistFile));
            if (!response.ok) throw new Error('Could not read playlist file');
            const text = await response.text();
            
            currentChannels = parseM3U(text);
            countLabel.innerText = `Channels: ${currentChannels.length}`;
            renderChannelList(currentChannels);
        } catch (error) {
            channelListContainer.innerHTML = `<div style="padding:1rem; color:#ef4444;">Error loading playlist. Make sure you run this page on a local web server (e.g. VS Code Live Server or Python server).</div>`;
            countLabel.innerText = 'Channels: 0';
        }
    }

    function parseM3U(m3uText) {
        const lines = m3uText.split(/\r?\n/);
        const channels = [];
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                currentItem = {};
                
                // Parse Logo
                const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                currentItem.logo = logoMatch ? logoMatch[1] : '';

                // Parse Name
                const commaIdx = line.lastIndexOf(',');
                currentItem.name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unnamed Channel';
            } else if (line && !line.startsWith('#')) {
                if (currentItem) {
                    currentItem.url = line;
                    channels.push(currentItem);
                    currentItem = null;
                }
            }
        }
        return channels;
    }

    function renderChannelList(channels) {
        const container = document.getElementById('channelList');
        container.innerHTML = '';

        if (channels.length === 0) {
            container.innerHTML = '<div style="padding:1rem; text-align:center; color:var(--text-muted);">No channels found.</div>';
            return;
        }

        channels.forEach((ch, idx) => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            
            const logo = document.createElement('img');
            logo.className = 'channel-logo';
            logo.src = ch.logo || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>';
            logo.onerror = () => { logo.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>'; };

            const title = document.createElement('span');
            title.className = 'channel-title';
            title.innerText = ch.name;

            item.appendChild(logo);
            item.appendChild(title);

            item.onclick = () => {
                document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                playStream(ch.url, ch.name);
            };

            container.appendChild(item);
        });
    }

    function filterChannels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = currentChannels.filter(ch => ch.name.toLowerCase().includes(query));
        renderChannelList(filtered);
    }

    function playStream(url, channelName) {
        const video = document.getElementById('videoPlayer');
        const nowPlaying = document.getElementById('nowPlaying');
        const badge = document.getElementById('statusBadge');

        nowPlaying.innerText = `Playing: ${channelName}`;
        badge.innerText = 'Connecting...';
        badge.className = 'status-badge';

        if (hlsInstance) {
            hlsInstance.destroy();
        }

        if (Hls.isSupported() && (url.includes('.m3u8') || !url.endsWith('.mp4'))) {
            hlsInstance = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
            });
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                badge.innerText = 'LIVE';
                badge.className = 'status-badge live';
            });
            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    badge.innerText = 'Stream Error / Offline';
                    badge.className = 'status-badge';
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl') || url.endsWith('.mp4')) {
            // Native HLS support (Safari) or standard MP4
            video.src = url;
            video.play();
            badge.innerText = 'LIVE';
            badge.className = 'status-badge live';
        } else {
            badge.innerText = 'Format Not Supported';
        }
    }
</script>

</body>
</html>
